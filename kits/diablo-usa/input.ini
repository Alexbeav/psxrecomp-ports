; PSXRecomp input mapping. PSX buttons are active when any listed
; source is pressed. Per-device overrides live in [mapping.<guid>].
; [gamepads] lists previously used pads (guid = display name).

[controller]
enabled = true
device = 0
deadzone = 3277

[mapping]
up        = dpup
down      = dpdown
left      = dpleft
right     = dpright
triangle  = y
circle    = b
cross     = a
square    = x
l1        = leftshoulder
l2        = lefttrigger
r1        = rightshoulder
r2        = righttrigger
l3        = leftstick
r3        = rightstick
start     = start
select    = back
ls_up     = lefty-
ls_down   = lefty+
ls_left   = leftx-
ls_right  = leftx+
rs_up     = righty-
rs_down   = righty+
rs_left   = rightx-
rs_right  = rightx+
